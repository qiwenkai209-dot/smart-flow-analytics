name: Docker Build & Publish

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - "core/**"
      - "configs/**"
      - "docker/**"
      - "frontend/**"
      - "models/**"
      - "pyproject.toml"
      - ".github/workflows/docker-publish.yml"
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-cpu:
    name: 构建 CPU 版镜像 (OpenVINO)
    runs-on: ubuntu-latest
    timeout-minutes: 60


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送 CPU 版镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.cpu
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest-cpu
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}-cpu
            ghcr.io/${{ github.repository }}:${{ github.sha }}-cpu
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-gpu:
    name: 构建 GPU 版镜像 (CUDA)
    runs-on: ubuntu-latest
    timeout-minutes: 60


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送 GPU 版镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.gpu
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest-gpu
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}-gpu
            ghcr.io/${{ github.repository }}:${{ github.sha }}-gpu
          cache-from: type=gha
          cache-to: type=gha,mode=max
