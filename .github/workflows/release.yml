name: Build & Release Windows App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    name: 云端构建 Windows 独立可执行程序便携包
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 构建前端静态资源
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装打包与运行依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller "numpy<2" "pandas<2.3" openpyxl shapely pydantic pydantic-settings pyyaml loguru fastapi uvicorn websockets sqlalchemy asyncpg opencv-python Pillow httpx

      - name: 使用 PyInstaller 打包
        run: |
          pyinstaller smart_flow.spec --noconfirm

      - name: 复制启动脚本和说明到打包目录
        run: |
          Get-ChildItem -Path "*.bat" | Copy-Item -Destination "dist/SmartFlowAnalytics/" -Force
          Copy-Item "README.md" -Destination "dist/SmartFlowAnalytics/" -Force


      - name: 压缩打包产物
        run: |
          Compress-Archive -Path "dist/SmartFlowAnalytics" -DestinationPath "SmartFlowAnalytics-Windows-x64.zip" -Force

      - name: 发布 Release 并上传可执行包
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: SmartFlowAnalytics-Windows-x64.zip
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: 上传构建产物工件 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SmartFlowAnalytics-Windows-x64
          path: SmartFlowAnalytics-Windows-x64.zip
          retention-days: 14
